plugins {
    id 'java'
}

group = 'com.emailatomizer'
version = '0.3.12'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2026.7'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

jar {
    archiveBaseName = 'email-atomizer'
    manifest {
        attributes('Implementation-Title': 'Email Atomizer', 'Implementation-Version': project.version)
    }
}
